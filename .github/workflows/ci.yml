name: Daily Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Daily Package
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/opods-clang-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Package app bundle
        run: ./script/build_and_run.sh --package

      - name: Archive daily package
        id: archive
        run: |
          package="dist/OPodsMac-daily.zip"
          ditto -c -k --keepParent dist/OPodsMac.app "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload daily package artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPodsMac-daily
          path: ${{ steps.archive.outputs.package }}
          if-no-files-found: error

  publish-daily:
    name: Refresh Daily Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download daily package artifact
        uses: actions/download-artifact@v4
        with:
          name: OPodsMac-daily
          path: dist

      - name: Refresh daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="dist/OPodsMac-daily.zip"
          notes="Automated daily build from $GITHUB_SHA."
          test -f "$package"
          git tag -f daily "$GITHUB_SHA"
          git push -f origin daily
          if gh release view daily >/dev/null 2>&1; then
            gh release upload daily "$package" --clobber
            gh release edit daily --title "Daily Build" --notes "$notes" --prerelease
          else
            gh release create daily "$package" --title "Daily Build" --notes "$notes" --prerelease --latest=false
          fi
