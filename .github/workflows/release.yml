name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./script/build_and_run.sh --package

      - name: Ad-hoc codesign
        run: codesign --force --deep -s - dist/OPodsMac.app

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent OPodsMac.app "OPodsMac-${GITHUB_REF_NAME}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPodsMac-${{ github.ref_name }}
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OPodsMac-*.zip
          generate_release_notes: true
